<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32C6 Sensor Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .connection-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .status.connected {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status.disconnected {
            background: #ffcdd2;
            color: #c62828;
        }

        .status.connecting {
            background: #fff9c4;
            color: #f57f17;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .sensor-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .sensor-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .sensor-value {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }

        .sensor-label {
            font-size: 20px;
            color: #666;
            margin-bottom: 5px;
        }

        .sensor-unit {
            font-size: 24px;
            color: #999;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .chart {
            width: 100%;
            height: 300px;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        .last-update {
            text-align: center;
            color: white;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ ESP32C6 Sensor Monitor</h1>
            <p>Real-time Temperature & Humidity Dashboard</p>
        </div>

        <div class="connection-panel">
            <div class="input-group">
                <input type="text" id="ipAddress" placeholder="ESP32C6 IP Address (e.g., 192.168.1.100)" value="192.168.1.100">
                <button id="connectBtn" onclick="connect()">Connect</button>
            </div>
            <div id="connectionStatus" class="status disconnected">Disconnected</div>
        </div>

        <div id="dashboardPanel" class="hidden">
            <div class="dashboard">
                <div class="sensor-card">
                    <div class="sensor-icon">🌡️</div>
                    <div class="sensor-label">Temperature</div>
                    <div class="sensor-value" id="temperature">--</div>
                    <div class="sensor-unit">°C</div>
                </div>

                <div class="sensor-card">
                    <div class="sensor-icon">💧</div>
                    <div class="sensor-label">Humidity</div>
                    <div class="sensor-value" id="humidity">--</div>
                    <div class="sensor-unit">%</div>
                </div>
            </div>

            <div class="chart-container">
                <h3>📊 Real-time Data Chart</h3>
                <canvas id="dataChart" class="chart"></canvas>
            </div>

            <div class="last-update" id="lastUpdate">Last update: --</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let esp32IP = '';
        let updateInterval = null;
        let chart = null;
        let chartData = {
            labels: [],
            temperature: [],
            humidity: []
        };
        const maxDataPoints = 20;

        function connect() {
            const ipInput = document.getElementById('ipAddress');
            esp32IP = ipInput.value.trim();
            
            if (!esp32IP) {
                alert('Please enter ESP32C6 IP address');
                return;
            }

            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.className = 'status connecting';
            statusDiv.textContent = 'Connecting...';

            // Test connection
            fetchData()
                .then(() => {
                    statusDiv.className = 'status connected';
                    statusDiv.textContent = 'Connected to ' + esp32IP;
                    document.getElementById('dashboardPanel').classList.remove('hidden');
                    document.getElementById('connectBtn').textContent = 'Disconnect';
                    document.getElementById('connectBtn').onclick = disconnect;
                    
                    // Initialize chart
                    initChart();
                    
                    // Start auto-update
                    updateInterval = setInterval(fetchData, 2000);
                })
                .catch(error => {
                    statusDiv.className = 'status disconnected';
                    statusDiv.textContent = 'Connection failed: ' + error.message;
                });
        }

        function disconnect() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
            
            document.getElementById('connectionStatus').className = 'status disconnected';
            document.getElementById('connectionStatus').textContent = 'Disconnected';
            document.getElementById('dashboardPanel').classList.add('hidden');
            document.getElementById('connectBtn').textContent = 'Connect';
            document.getElementById('connectBtn').onclick = connect;
            esp32IP = '';
        }

        async function fetchData() {
            if (!esp32IP) return;

            try {
                const response = await fetch(`http://${esp32IP}/data`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                updateDisplay(data);
                updateChart(data);
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }

        function updateDisplay(data) {
            document.getElementById('temperature').textContent = data.temperature.toFixed(2);
            document.getElementById('humidity').textContent = data.humidity.toFixed(2);
            document.getElementById('lastUpdate').textContent = 'Last update: ' + data.lastUpdate;
        }

        function initChart() {
            const ctx = document.getElementById('dataChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        {
                            label: 'Temperature (°C)',
                            data: chartData.temperature,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Humidity (%)',
                            data: chartData.humidity,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    }
                }
            });
        }

        function updateChart(data) {
            if (!chart) return;

            const now = new Date().toLocaleTimeString();
            chartData.labels.push(now);
            chartData.temperature.push(data.temperature);
            chartData.humidity.push(data.humidity);

            // Keep only last N data points
            if (chartData.labels.length > maxDataPoints) {
                chartData.labels.shift();
                chartData.temperature.shift();
                chartData.humidity.shift();
            }

            chart.update();
        }
    </script>
</body>
</html>
